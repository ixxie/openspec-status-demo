name: openspec-gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The git dependency's prepare script builds with pnpm.
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - run: npm ci
      - name: shipped ⇒ folded
        run: npx openspec sync --check
      - name: lifecycle states (informational)
        run: npx openspec list --json | head -40
